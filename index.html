<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ทุนเพชร UMT</title>
<!-- ไอคอนบนหน้าจอโฮม (iPhone / iPad / Android) -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ทุนเพชร UMT">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0B2A5B">
<style>
  html, body { margin: 0; height: 100%; background: #0B2A5B; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #F5F8FC; }
  #wait { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
          color: #cfe3ff; font: 15px/1.5 -apple-system, "Sukhumvit Set", "Noto Sans Thai", sans-serif; background: #0B2A5B; transition: opacity .3s; }
  #wait img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  #wait a { color: #F2C94C; display: none; }
  #wait.slow a { display: inline; }
</style>
</head>
<body>
<div id="wait"><img src="apple-touch-icon.png" alt=""><div>กำลังเปิดระบบทุนเพชร UMT...</div><a id="direct" href="#" target="_top">แตะที่นี่หากหน้าไม่ขึ้น</a></div>
<iframe id="app" title="ระบบทุนเพชร UMT" allow="clipboard-write; fullscreen; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
<script>
  // ★ ใส่ลิงก์ Web App ของระบบ (ลงท้ายด้วย /exec) ตรงนี้ ★
  var APP_URL = 'https://script.google.com/macros/s/AKfycbyk6-oHS5SjI0cYYL3f2IRGjo8mJQ6iFC8WnFB5a4A4nlxelbiKTAKDNoAEvKAhLf4S/exec';

  var url = APP_URL + (location.search || '');      // ส่งต่อ ?verify= / ?checkin= ถ้ามี
  var frame = document.getElementById('app'), wait = document.getElementById('wait');
  document.getElementById('direct').href = url;
  frame.onload = function () { wait.style.opacity = '0'; setTimeout(function () { wait.style.display = 'none'; }, 300); };
  setTimeout(function () { wait.className = 'slow'; }, 8000);
  frame.src = url;
</script>
</body>
</html>
